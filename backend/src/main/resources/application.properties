spring.application.name=careerai-backend
server.port=${PORT:8080}

# Database Configuration
spring.datasource.url=${DATABASE_URL:}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}

# HikariCP Connection Pool Optimization
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=30000

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (256-bit secret key)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D6351}
jwt.expiration-ms=86400000

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Logging
logging.level.com.careerai=INFO
logging.level.org.springframework.security=WARN


