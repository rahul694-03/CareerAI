# Render Blueprint for CareerAI (PostgreSQL + Spring Boot Backend + React Frontend)
version: "1"

databases:
  - name: careerai-db
    databaseName: careerai
    user: postgres
    plan: free

services:
  # Spring Boot Backend API
  - type: web
    name: careerai-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/jobs/providers/status
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: careerai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://*.onrender.com,https://*.vercel.app

  # React Vite Frontend (Static Site)
  - type: web
    name: careerai-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: careerai-backend
          envVarKey: RENDER_EXTERNAL_URL
